<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barrel Brawl</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #12121a;
  color: #ccc;
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  user-select: none;
}

/* ── TOP BAR ── */
#topbar {
  width: 100%;
  max-width: 430px;
  background: #1a1a28;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  gap: 8px;
}
#topbar button {
  background: none; border: none;
  color: #55556a; font-size: 12px;
  cursor: pointer; padding: 4px 8px;
  white-space: nowrap;
}
#topbar button:hover { color: #aaa; }

/* ── TURN BANNER ── */
#turn-banner {
  width: 100%;
  max-width: 430px;
  text-align: center;
  font-size: 15px;
  font-weight: 800;
  padding: 10px 0 8px;
  letter-spacing: 0.5px;
  transition: background 0.2s, color 0.2s;
}

/* ── TIMER ── */
#timer-bar-wrap {
  width: 100%;
  max-width: 430px;
  height: 4px;
  background: #1e1e2e;
}
#timer-bar {
  height: 4px;
  background: #55556a;
  transition: width 1s linear, background 0.3s;
}

/* ── GAME AREA ── */
#game { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 430px; }

/* ── HAND ── */
.hand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  width: 100%;
  border-radius: 8px;
  margin: 4px 0;
  transition: background 0.2s;
}
.hand.active-hand { background: #1e1e30; }
.hand-label {
  font-size: 11px;
  font-weight: 700;
  min-width: 52px;
  white-space: nowrap;
}
.barrel-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
  border: 2px solid transparent;
  transition: border-color 0.15s, background 0.15s;
}
.barrel-btn:hover:not(.disabled) { background: #2a2a3e; }
.barrel-btn.selected { border-color: #fdd835; background: #2a2a3e; }
.barrel-btn.disabled { opacity: 0.2; cursor: default; }
.barrel-btn canvas { display: block; }
.barrel-btn .count { font-size: 10px; font-weight: 700; color: #666; }
.barrel-btn.selected .count { color: #fdd835; }

/* ── BOARD ── */
#board-wrap { padding: 2px 0; position: relative; }
#board { display: block; cursor: pointer; }
#board-overlay {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700;
  color: #888; pointer-events: none;
}

/* ── STATUS ── */
#status {
  font-size: 11px; color: #55556a;
  padding: 4px 0 10px; min-height: 22px;
  text-align: center; width: 100%;
}

/* ── MENU ── */
#menu {
  display: flex; flex-direction: column;
  align-items: center;
  padding: 50px 30px; gap: 12px;
  width: 100%; max-width: 360px;
}
#menu h1 { font-size: 28px; font-weight: 800; color: white; margin-bottom: 2px; }
#menu p  { font-size: 12px; color: #55556a; }
.menu-btn {
  width: 200px; padding: 12px;
  background: #b71c1c; color: white;
  border: none; border-radius: 8px;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: background 0.15s;
}
.menu-btn:hover { background: #c62828; }
.menu-legend { display: flex; gap: 14px; margin-top: 16px; }
.legend-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #55556a; }

/* ── ONLINE PANEL ── */
#online-panel {
  display: none; flex-direction: column;
  align-items: center; gap: 12px;
  width: 100%; max-width: 360px;
  padding: 50px 30px;
}
#online-panel h2 { font-size: 20px; font-weight: 700; color: white; }
.online-btn {
  width: 220px; padding: 11px;
  background: #0d47a1; color: white;
  border: none; border-radius: 8px;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
}
.online-btn:hover { background: #1565c0; }
#join-wrap { display: flex; gap: 8px; }
#join-code {
  width: 110px; padding: 10px 12px;
  background: #1e1e2e; color: white;
  border: 1px solid #33334a; border-radius: 8px;
  font-size: 15px; font-weight: 700;
  letter-spacing: 3px; text-transform: uppercase;
  text-align: center;
}
#join-code:focus { outline: none; border-color: #fdd835; }
#join-submit {
  padding: 10px 16px;
  background: #1e1e2e; color: #fdd835;
  border: 1px solid #fdd835; border-radius: 8px;
  font-size: 13px; font-weight: 700; cursor: pointer;
}
#back-btn {
  background: none; border: none;
  color: #55556a; font-size: 12px;
  cursor: pointer; margin-top: 8px;
}
#back-btn:hover { color: #aaa; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar" style="display:none">
  <button id="menu-btn">← Menu</button>
  <div id="topbar-center" style="flex:1;text-align:center;font-size:12px;color:#55556a"></div>
  <button id="restart-btn">Restart</button>
</div>

<!-- TURN BANNER -->
<div id="turn-banner" style="display:none"></div>

<!-- TIMER BAR -->
<div id="timer-bar-wrap" style="display:none">
  <div id="timer-bar" style="width:100%"></div>
</div>

<!-- MENU -->
<div id="menu">
  <h1>Barrel Brawl</h1>
  <p style="margin-bottom:20px">Merge barrels · own the grid</p>
  <button class="menu-btn" id="btn-bot">vs Bot</button>
  <button class="menu-btn" id="btn-local">2 Players (same device)</button>
  <button class="menu-btn" id="btn-online" style="background:#0d47a1">Online (2 devices)</button>
  <div class="menu-legend" id="legend"></div>
  <p style="margin-top:12px;text-align:center;line-height:1.7">
    Place on empty cells, or cover any<br>same-tier barrel to merge up.<br>15 seconds per turn.
  </p>
</div>

<!-- ONLINE PANEL -->
<div id="online-panel">
  <h2>Online</h2>
  <button class="online-btn" id="create-btn">Create Room</button>
  <p style="color:#55556a;font-size:12px">— or join a friend's room —</p>
  <div id="join-wrap">
    <input id="join-code" maxlength="4" placeholder="CODE">
    <button id="join-submit">Join</button>
  </div>
  <button id="back-btn">← Back</button>
</div>

<!-- GAME -->
<div id="game">
  <div class="hand" id="hand-top"></div>
  <div id="board-wrap">
    <canvas id="board"></canvas>
    <div id="board-overlay"></div>
  </div>
  <div class="hand" id="hand-bottom"></div>
  <div id="status"></div>
</div>

<script>
// ── CONSTANTS ────────────────────────────────────────────────────────────────
const TIER_COLOR = {
  small:  { body:"#4caf50", cap:"#388e3c", band:"#2e7d32" },
  medium: { body:"#ff9800", cap:"#e65100", band:"#bf360c" },
  large:  { body:"#ab47bc", cap:"#6a1b9a", band:"#4a148c" },
  mega:   { body:"#fdd835", cap:"#f9a825", band:"#f57f17" },
};

// In the UI, "me" is always blue, opponent is always red
const ME_BG    = "#0d47a1";
const ME_HOVER = "#1565c0";
const ME_TEXT  = "#90caf9";
const OPP_BG    = "#b71c1c";
const OPP_HOVER = "#c62828";
const OPP_TEXT  = "#ef9a9a";

const CELL = 110, PAD = 8;
const BOARD_PX = CELL * 3 + PAD * 4;
const BW = 22, BH = 36, RIM = 4;
const TIMER_SECS = 15;

// ── STATE ─────────────────────────────────────────────────────────────────────
let socket, roomCode, myPlayer, gameMode;
let gameState = null;
let selected  = null;
let hoverCell = null;
let timerInterval = null;
let timerRemaining = TIMER_SECS;
let timerForPlayer = null;  // which game-player the current timer is for

// ── SOCKET ───────────────────────────────────────────────────────────────────
function connectSocket() {
  if (socket) return;
  socket = io();

  socket.on("joined", d => {
    roomCode = d.code;
    myPlayer = d.player;
    showGame();
    if (d.mode === "online") {
      document.getElementById("topbar-center").textContent = `Room: ${d.code}`;
    }
  });

  socket.on("state", s => {
    gameState = s;
    selected  = null;
    renderAll();
  });

  socket.on("start_turn", d => {
    startClientTimer(d.player);
  });

  socket.on("status", d => {
    setStatus(d.msg, d.color);
  });

  socket.on("error", d => {
    setStatus(d.msg, "#e53935");
  });
}

// ── MENU ─────────────────────────────────────────────────────────────────────
document.getElementById("btn-bot").onclick = () => {
  gameMode = "bot"; connectSocket(); socket.emit("start_bot");
};
document.getElementById("btn-local").onclick = () => {
  gameMode = "local"; connectSocket(); socket.emit("start_local");
};
document.getElementById("btn-online").onclick = () => {
  document.getElementById("menu").style.display = "none";
  document.getElementById("online-panel").style.display = "flex";
};
document.getElementById("create-btn").onclick = () => {
  gameMode = "online"; connectSocket(); socket.emit("create_online");
};
document.getElementById("join-submit").onclick = () => {
  const code = document.getElementById("join-code").value.trim().toUpperCase();
  if (code.length !== 4) { alert("Enter a 4-letter room code."); return; }
  gameMode = "online"; connectSocket(); socket.emit("join_online", { code });
};
document.getElementById("back-btn").onclick = () => {
  document.getElementById("online-panel").style.display = "none";
  document.getElementById("menu").style.display = "flex";
};
document.getElementById("menu-btn").onclick = goMenu;
document.getElementById("restart-btn").onclick = () => {
  if (!roomCode) return;
  selected = null;
  socket.emit("restart", { code: roomCode });
};

function showGame() {
  document.getElementById("menu").style.display        = "none";
  document.getElementById("online-panel").style.display = "none";
  document.getElementById("topbar").style.display      = "flex";
  document.getElementById("turn-banner").style.display = "block";
  document.getElementById("timer-bar-wrap").style.display = "block";
  document.getElementById("game").style.display        = "flex";
  const canvas = document.getElementById("board");
  canvas.width  = BOARD_PX;
  canvas.height = BOARD_PX;
  canvas.onclick      = onBoardClick;
  canvas.onmousemove  = onBoardHover;
  canvas.onmouseleave = () => { hoverCell = null; drawBoard(); };
  buildLegend();
}

function goMenu() {
  stopTimer();
  document.getElementById("topbar").style.display      = "none";
  document.getElementById("turn-banner").style.display = "none";
  document.getElementById("timer-bar-wrap").style.display = "none";
  document.getElementById("game").style.display        = "none";
  document.getElementById("menu").style.display        = "flex";
  document.getElementById("topbar-center").textContent = "";
  gameState = null; selected = null;
}

// ── CLIENT-SIDE TIMER ────────────────────────────────────────────────────────
function startClientTimer(forPlayer) {
  stopTimer();
  if (!gameState || gameState.over) return;

  // In bot mode, don't show timer during bot's turn
  if (gameMode === "bot" && forPlayer === 2) {
    setTimerBar(0, false);
    return;
  }

  timerForPlayer  = forPlayer;
  timerRemaining  = TIMER_SECS;
  updateTimerBar(timerRemaining);

  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerBar(timerRemaining);
    if (timerRemaining <= 0) {
      stopTimer();
      // Only the player whose turn it is emits timeout
      const iMyTurn = isMyTurn();
      if (iMyTurn || gameMode === "local") {
        socket.emit("turn_timeout", { code: roomCode, player: timerForPlayer });
      }
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerForPlayer = null;
}

function updateTimerBar(t) {
  const bar = document.getElementById("timer-bar");
  const pct = (t / TIMER_SECS) * 100;
  bar.style.width = pct + "%";
  bar.style.background = t <= 5 ? "#e53935" : (t <= 10 ? "#ff9800" : "#4caf50");
}

function setTimerBar(pct, urgent) {
  const bar = document.getElementById("timer-bar");
  bar.style.width = pct + "%";
  bar.style.background = urgent ? "#e53935" : "#55556a";
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
// Map a game player (1 or 2) to "me" or "opp" in this client's perspective
function isMe(gamePlayerId) {
  if (gameMode === "local") return false; // no "me" in local
  if (gameMode === "bot")   return gamePlayerId === 1; // you are always player 1 vs bot
  return gamePlayerId === myPlayer; // online
}

function isMyTurn() {
  if (!gameState) return false;
  if (gameMode === "local")  return true;
  if (gameMode === "bot")    return gameState.current === 1;
  return gameState.current === myPlayer;
}

function cellBg(owner, isHover) {
  // In local mode: player 1 = red, player 2 = blue
  if (gameMode === "local") {
    if (owner === 1) return isHover ? OPP_HOVER : OPP_BG;
    else             return isHover ? ME_HOVER   : ME_BG;
  }
  // Bot / online: "me" = blue, opponent = red
  if (isMe(owner)) return isHover ? ME_HOVER  : ME_BG;
  else             return isHover ? OPP_HOVER : OPP_BG;
}

// ── BARREL DRAW ──────────────────────────────────────────────────────────────
function drawBarrel(ctx, cx, cy, tier) {
  const c  = TIER_COLOR[tier];
  const x0 = cx - BW, y0 = cy - BH, x1 = cx + BW, y1 = cy + BH;
  ctx.fillStyle = c.body;
  ctx.fillRect(x0, y0, BW*2, BH*2);
  ctx.fillStyle = c.cap;
  ctx.beginPath(); ctx.ellipse(cx, y1, BW, RIM, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = c.band;
  const sp = (BH*2) / 4;
  for (let i = 1; i <= 3; i++) { const by = y0 + i*sp; ctx.fillRect(x0, by-2, BW*2, 4); }
  ctx.fillStyle = c.cap;
  ctx.beginPath(); ctx.ellipse(cx, y0, BW, RIM, 0, 0, Math.PI*2); ctx.fill();
  if (tier === "mega") {
    ctx.fillStyle = "#7a5800";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("★", cx, cy + 2);
  }
}

// ── BOARD ─────────────────────────────────────────────────────────────────────
function cellRect(r, c) {
  return { x: PAD + c*(CELL+PAD), y: PAD + r*(CELL+PAD), w: CELL, h: CELL };
}
function xyToCell(x, y) {
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 3; c++) {
      const {x:cx, y:cy, w, h} = cellRect(r, c);
      if (x>=cx && x<=cx+w && y>=cy && y<=cy+h) return [r, c];
    }
  return null;
}

function drawBoard() {
  if (!gameState) return;
  const canvas = document.getElementById("board");
  const ctx    = canvas.getContext("2d");
  ctx.fillStyle = "#0d0d18";
  ctx.fillRect(0, 0, BOARD_PX, BOARD_PX);
  const winSet = new Set((gameState.winCells||[]).map(([r,c])=>`${r},${c}`));
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const {x, y, w, h} = cellRect(r, c);
      const stack   = gameState.board[r][c];
      const isHover = hoverCell && hoverCell[0]===r && hoverCell[1]===c;
      const isWin   = winSet.has(`${r},${c}`);
      let bg;
      if (isWin) bg = "#5a4a00";
      else if (stack.length > 0) bg = cellBg(stack[stack.length-1][0], isHover);
      else bg = (isHover && selected && isMyTurn()) ? "#2a2a3e" : "#1e1e2e";
      ctx.fillStyle = bg;
      ctx.fillRect(x, y, w, h);
      if (stack.length > 0) {
        const [, tier] = stack[stack.length-1];
        drawBarrel(ctx, x+w/2, y+h/2, tier);
      }
    }
  }
}

// ── HANDS ────────────────────────────────────────────────────────────────────
// In online mode: bottom = me (always), top = opponent
// In bot mode:    bottom = you (player 1), top = bot (player 2)
// In local mode:  bottom = player 1, top = player 2

function getHandConfig() {
  // Returns { bottom: {gamePlayer, label, color}, top: {gamePlayer, label, color} }
  if (gameMode === "online") {
    return {
      bottom: { gamePlayer: myPlayer,   label: "You",      textColor: ME_TEXT  },
      top:    { gamePlayer: 3-myPlayer, label: "Opponent", textColor: OPP_TEXT },
    };
  }
  if (gameMode === "bot") {
    return {
      bottom: { gamePlayer: 1, label: "You", textColor: ME_TEXT  },
      top:    { gamePlayer: 2, label: "Bot", textColor: OPP_TEXT },
    };
  }
  // local
  return {
    bottom: { gamePlayer: 1, label: "Red",  textColor: OPP_TEXT },
    top:    { gamePlayer: 2, label: "Blue",  textColor: ME_TEXT  },
  };
}

function buildHands() {
  const cfg = getHandConfig();
  buildHandEl("hand-bottom", cfg.bottom, true);
  buildHandEl("hand-top",    cfg.top,    false);
}

function buildHandEl(elId, cfg, isBottom) {
  const el     = document.getElementById(elId);
  el.innerHTML = "";

  const { gamePlayer, label, textColor } = cfg;
  const counts   = gameState.counts[String(gamePlayer)];
  const isCurrent = gameState.current === gamePlayer;
  const canAct   = isCurrent && !gameState.over
                   && (gameMode === "local" || (isBottom && !gameState.over));

  // Only the bottom hand is ever interactive (top = opponent, always passive)
  const interactive = isBottom && isCurrent && !gameState.over;

  el.className = "hand" + (isCurrent && !gameState.over ? " active-hand" : "");

  const lbl = document.createElement("span");
  lbl.className   = "hand-label";
  lbl.textContent = label;
  lbl.style.color = isCurrent && !gameState.over ? textColor : "#33334a";
  el.appendChild(lbl);

  for (const tier of ["small", "medium", "large"]) {
    const count  = counts[tier];
    const avail  = interactive && count > 0;
    const isSel  = avail && selected === tier;

    const wrap = document.createElement("div");
    wrap.className = "barrel-btn" + (isSel ? " selected" : "") + (avail ? "" : " disabled");

    const cw = (BW+10)*2, ch = BH*2+RIM*2+18;
    const cc = document.createElement("canvas");
    cc.width = cw; cc.height = ch;
    const ctx2 = cc.getContext("2d");
    if (count > 0) {
      drawBarrel(ctx2, cw/2, ch/2-6, tier);
    } else {
      ctx2.globalAlpha = 0.15;
      drawBarrel(ctx2, cw/2, ch/2-6, tier);
      ctx2.globalAlpha = 1;
    }
    wrap.appendChild(cc);

    const countEl = document.createElement("div");
    countEl.className   = "count";
    countEl.textContent = `×${count}`;
    wrap.appendChild(countEl);

    if (avail) wrap.onclick = () => selectTier(tier, gamePlayer);
    el.appendChild(wrap);
  }
}

function selectTier(tier, gamePlayer) {
  if (!gameState || gameState.over) return;
  if (!isMyTurn() && gameMode !== "local") return;
  selected = tier;
  setStatus("Click a cell to place the barrel.", "#ccccdd");
  buildHands();
  drawBoard();
}

// ── INTERACTION ──────────────────────────────────────────────────────────────
function onBoardClick(e) {
  if (!gameState || gameState.over) return;
  if (!isMyTurn() && gameMode !== "local") {
    setStatus("It's not your turn.", "#e53935"); return;
  }
  if (!selected) { setStatus("Pick a barrel first.", "#e53935"); return; }
  const rect = e.target.getBoundingClientRect();
  const cell = xyToCell(e.clientX-rect.left, e.clientY-rect.top);
  if (!cell) return;
  const [r, c]  = cell;
  const player  = gameMode === "local" ? gameState.current : myPlayer;
  socket.emit("move", { code: roomCode, tier: selected, row: r, col: c, player });
  selected = null;
}

function onBoardHover(e) {
  const rect = e.target.getBoundingClientRect();
  const cell = xyToCell(e.clientX-rect.left, e.clientY-rect.top);
  const key  = cell ? cell.join(",") : null;
  const prev = hoverCell ? hoverCell.join(",") : null;
  if (key !== prev) { hoverCell = cell; drawBoard(); }
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderAll() {
  if (!gameState) return;
  drawBoard();
  buildHands();
  updateTurnBanner();
  updateBoardOverlay();
  if (gameState.over) {
    stopTimer();
    setTimerBar(0, false);
  } else {
    setStatus("Select a barrel, then click a cell.", "#55556a");
  }
}

function updateTurnBanner() {
  const banner = document.getElementById("turn-banner");
  if (!gameState) return;

  if (gameState.over) {
    const w = gameState.winner;
    if (w === 0) {
      banner.textContent = "Draw!";
      banner.style.background = "#1e1e2e";
      banner.style.color = "#888";
    } else {
      const iWon = (gameMode === "online" && w === myPlayer)
                || (gameMode === "bot"    && w === 1)
                || (gameMode === "local");
      banner.textContent = gameMode === "local"
        ? (w === 1 ? "Red wins! 🎉" : "Blue wins! 🎉")
        : (iWon ? "You win! 🎉" : "Opponent wins!");
      banner.style.background = iWon ? "#1a3a1a" : "#1e1e2e";
      banner.style.color = iWon ? "#4caf50" : "#e53935";
    }
    return;
  }

  const myTurn = isMyTurn();
  if (gameMode === "local") {
    const cur = gameState.current;
    banner.textContent  = cur === 1 ? "Red's turn" : "Blue's turn";
    banner.style.background = cur === 1 ? "#2a0a0a" : "#0a0a2a";
    banner.style.color      = cur === 1 ? OPP_TEXT  : ME_TEXT;
  } else if (gameMode === "bot" && !myTurn) {
    banner.textContent      = "Bot is thinking…";
    banner.style.background = "#0a0a2a";
    banner.style.color      = OPP_TEXT;
  } else {
    banner.textContent      = myTurn ? "Your turn" : "Opponent's turn";
    banner.style.background = myTurn ? "#0a1a2a" : "#1a0a0a";
    banner.style.color      = myTurn ? ME_TEXT    : OPP_TEXT;
  }
}

function updateBoardOverlay() {
  const overlay = document.getElementById("board-overlay");
  // Dim board when it's not your turn (online/bot)
  if (!gameState || gameState.over || gameMode === "local") {
    overlay.style.display = "none";
    return;
  }
  if (!isMyTurn()) {
    overlay.style.display = "flex";
    overlay.textContent   = gameMode === "bot" ? "Bot thinking…" : "Opponent's turn";
  } else {
    overlay.style.display = "none";
  }
}

function setStatus(msg, color) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.style.color = color || "#55556a";
}

// ── LEGEND ───────────────────────────────────────────────────────────────────
function buildLegend() {
  const el = document.getElementById("legend");
  el.innerHTML = "";
  for (const [tier, lbl] of [["small","Small"],["medium","Med"],["large","Large"]]) {
    const item = document.createElement("div");
    item.className = "legend-item";
    const cw = 40, ch = 60;
    const cc = document.createElement("canvas");
    cc.width = cw; cc.height = ch;
    drawBarrel(cc.getContext("2d"), cw/2, ch/2, tier);
    item.appendChild(cc);
    const t = document.createElement("span"); t.textContent = lbl;
    item.appendChild(t);
    el.appendChild(item);
  }
}
buildLegend();

document.getElementById("join-code").addEventListener("input", function() {
  this.value = this.value.toUpperCase();
});
</script>
